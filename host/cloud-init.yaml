#cloud-config

# Bootstrap for a fresh Ubuntu Server 24.04 LTS ARM64 Multipass instance.
# It deliberately does not configure Cloudflare, GitHub, DNS, or application
# credentials. Those steps remain manual and are documented in HOSTING_SETUP.md.

hostname: hosting
manage_etc_hosts: true
timezone: America/New_York
ssh_pwauth: false
disable_root: true

groups:
  - docker

users:
  - default
  - name: deploy
    gecos: Deployment service account
    shell: /bin/bash
    lock_passwd: true
    groups:
      - adm
      - docker

package_update: true
package_upgrade: true
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - git
  - gnupg
  - jq
  - logrotate
  - openssl
  - rsync
  - ufw
  - unattended-upgrades

write_files:
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root:root
    permissions: "0o644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";

  - path: /etc/apt/apt.conf.d/52hosting-unattended-upgrades
    owner: root:root
    permissions: "0o644"
    content: |
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Automatic-Reboot "false";

  - path: /etc/docker/daemon.json
    owner: root:root
    permissions: "0o644"
    content: |
      {
        "ip": "127.0.0.1",
        "live-restore": true,
        "log-driver": "local",
        "log-opts": {
          "max-size": "10m",
          "max-file": "5"
        },
        "default-network-opts": {
          "bridge": {
            "com.docker.network.bridge.host_binding_ipv4": "127.0.0.1"
          }
        }
      }

  - path: /etc/systemd/journald.conf.d/hosting.conf
    owner: root:root
    permissions: "0o644"
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=512M
      RuntimeMaxUse=128M
      MaxRetentionSec=14day

  - path: /etc/logrotate.d/hosting-apps
    owner: root:root
    permissions: "0o644"
    content: |
      /srv/apps/*/*/logs/*.log /srv/edge/logs/*.log {
          daily
          rotate 14
          size 10M
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
          su deploy deploy
      }

runcmd:
  - |
      set -eu
      test "$(dpkg --print-architecture)" = "arm64"
      . /etc/os-release
      test "${VERSION_ID}" = "24.04"

      install -m 0755 -d /etc/apt/keyrings
      curl --proto '=https' --tlsv1.2 -fsSL \
        https://download.docker.com/linux/ubuntu/gpg \
        -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      printf '%s\n' \
        "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
        > /etc/apt/sources.list.d/docker.list

      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        docker-ce \
        docker-ce-cli \
        containerd.io \
        docker-buildx-plugin \
        docker-compose-plugin

      systemctl daemon-reload
      systemctl enable --now docker
      systemctl enable --now unattended-upgrades
      systemctl try-restart systemd-journald.service
      usermod -aG docker deploy

      install -d -o deploy -g deploy -m 0750 \
        /srv/apps \
        /srv/apps/portfolio \
        /srv/apps/portfolio/staging \
        /srv/apps/portfolio/staging/logs \
        /srv/apps/portfolio/staging/releases \
        /srv/apps/portfolio/prod \
        /srv/apps/portfolio/prod/logs \
        /srv/apps/portfolio/prod/releases \
        /srv/edge \
        /srv/edge/conf \
        /srv/edge/logs \
        /srv/backups \
        /srv/backups/portfolio \
        /srv/backups/portfolio/staging \
        /srv/backups/portfolio/prod \
        /srv/actions-runner \
        /srv/actions-runner/portfolio

      install -d -o root -g deploy -m 0750 \
        /srv/secrets \
        /srv/secrets/portfolio

      # Caddy needs to traverse its bind-mounted, non-secret configuration
      # directory. Container hardening is defined separately in edge Compose.
      chmod 0755 /srv/edge/conf

      docker network inspect web >/dev/null 2>&1 || \
        docker network create \
          --driver bridge \
          --attachable \
          --subnet 172.18.0.0/16 \
          --opt com.docker.network.bridge.host_binding_ipv4=127.0.0.1 \
          web

      if ! swapon --show=NAME --noheadings | grep -Fxq /swapfile; then
        if [ ! -f /swapfile ]; then
          fallocate -l 2G /swapfile
        fi
        chmod 0600 /swapfile
        mkswap /swapfile
        swapon /swapfile
      fi
      grep -Eq '^/swapfile[[:space:]]' /etc/fstab || \
        printf '/swapfile none swap sw 0 0\n' >> /etc/fstab

      default_interface="$(ip -4 route show default | awk 'NR == 1 { print $5 }')"
      multipass_subnet="$(ip -o -4 route show dev "${default_interface}" proto kernel scope link | awk 'NR == 1 { print $1 }')"
      test -n "${default_interface}"
      test -n "${multipass_subnet}"

      ufw default deny incoming
      ufw default allow outgoing
      ufw allow in on "${default_interface}" \
        from "${multipass_subnet}" \
        to any port 22 proto tcp \
        comment 'Multipass NAT management SSH'
      ufw logging low
      ufw --force enable

      {
        printf '# Mac mini hosting VM bootstrap\n\n'
        printf 'Completed (UTC): %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        printf 'Architecture: %s\n' "$(dpkg --print-architecture)"
        printf 'Ubuntu: %s\n' "$(. /etc/os-release && printf '%s' "$PRETTY_NAME")"
        docker version --format 'Docker Server: {{.Server.Version}}'
        docker compose version
        printf 'Shared Docker network: web\n'
        printf 'Production enabled: no\n'
      } > /srv/HOSTING_BOOTSTRAP.log
      chmod 0644 /srv/HOSTING_BOOTSTRAP.log

final_message: >-
  Ubuntu hosting bootstrap completed. Review /srv/HOSTING_BOOTSTRAP.log and
  HOSTING_SETUP.md before adding any credential, tunnel route, or production service.
