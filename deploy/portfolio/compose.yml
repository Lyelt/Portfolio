services:
  db:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      - POSTGRES_DB
      - POSTGRES_PASSWORD
      - POSTGRES_USER
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - db_private

  app:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    stop_grace_period: 30s
    environment:
      - ASPNETCORE_ENVIRONMENT=${APP_ENVIRONMENT:?APP_ENVIRONMENT is required}
      - ASPNETCORE_URLS=http://+:8080
      - CONNECTION_STRING
      - FORWARDED_HEADERS_KNOWN_PROXY=172.18.0.2
      - GAME_NIGHT_FIRST_USER_NAME=${GAME_NIGHT_FIRST_USER_NAME:-Nick}
      - JWT_AUDIENCE
      - JWT_ISSUER
      - JWT_SECURITY_KEY
    depends_on:
      db:
        condition: service_healthy
    networks:
      db_private: {}
      web:
        aliases:
          - ${WEB_ALIAS:?WEB_ALIAS is required}

  migrate:
    image: ${IMAGE_REF:?IMAGE_REF is required}
    restart: "no"
    entrypoint:
      - dotnet
      - dbup/PortfolioDatabase.dll
    healthcheck:
      disable: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      - CONNECTION_STRING
    depends_on:
      db:
        condition: service_healthy
    networks:
      - db_private

volumes:
  db_data:
    name: ${DB_VOLUME_NAME:?DB_VOLUME_NAME is required}

networks:
  db_private:
    name: portfolio-${DEPLOY_ENV:?DEPLOY_ENV is required}-db
    internal: true
  web:
    external: true
    name: web
