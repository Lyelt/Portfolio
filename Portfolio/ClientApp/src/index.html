<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nicholas Ghobrial</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Nicholas Ghobrial: Portfolio, Projects, Skills, About, Contact, Blog">
  <meta name="author" content="Nicholas Ghobrial" />
  <meta name="keywords" content="developer,portfolio,software,engineer,resume" />
  <meta name="title" content="Nicholas Ghobrial's Portfolio" />
  <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#171b24" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="n.ico">
  <script>
    (() => {
      const savedTheme = localStorage.getItem('theme');
      const theme = savedTheme === 'light' || savedTheme === 'dark'
        ? savedTheme
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

      document.documentElement.classList.add(theme);
      localStorage.setItem('theme', theme);
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
