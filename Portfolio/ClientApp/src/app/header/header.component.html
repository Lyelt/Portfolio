<header class="site-header">
  <nav class="site-nav page-container" aria-label="Primary navigation">
    <a class="brand" routerLink="/" aria-label="Nicholas Ghobrial — home" (click)="closeMobileMenu()">
      <span class="brand-mark" aria-hidden="true">N</span>
      <span class="brand-name">Nicholas Ghobrial</span>
    </a>

    <div class="desktop-nav" aria-label="Portfolio sections">
      <a class="nav-link nav-link-hover" [routerLink]="['/']" fragment="projects">Projects</a>
      <a class="nav-link nav-link-hover" [routerLink]="['/']" fragment="skills">Skills</a>
      <a class="nav-link nav-link-hover" [routerLink]="['/']" fragment="about">About</a>
      <a class="nav-link nav-link-hover" [routerLink]="['/']" fragment="contact">Contact</a>
      <a class="nav-link nav-link-hover" routerLink="/blog" routerLinkActive="active">Blog</a>
    </div>

    <div class="header-actions">
      <app-theme-toggle></app-theme-toggle>

      <button type="button" class="icon-button desktop-more" [matMenuTriggerFor]="menu" aria-label="Open project apps menu">
        <mat-icon aria-hidden="true">apps</mat-icon>
      </button>

      <button type="button" class="icon-button mobile-menu-button" aria-controls="mobile-navigation"
              [attr.aria-expanded]="mobileMenuOpen" [attr.aria-label]="mobileMenuOpen ? 'Close navigation menu' : 'Open navigation menu'"
              (click)="toggleMobileMenu()">
        <mat-icon aria-hidden="true">{{mobileMenuOpen ? 'close' : 'menu'}}</mat-icon>
      </button>
    </div>

    <mat-menu #menu="matMenu" xPosition="before">
      <a mat-menu-item routerLink="/bowling" class="menu-item"><mat-icon svgIcon="bowling"></mat-icon>Bowling</a>
      <a mat-menu-item routerLink="/yugioh" class="menu-item"><mat-icon svgIcon="yugioh"></mat-icon>Yu-Gi-Oh</a>
      <a mat-menu-item routerLink="/initiative" class="menu-item"><mat-icon>repeat_one</mat-icon>Initiative</a>
      <a mat-menu-item routerLink="/speedrun" class="menu-item"><mat-icon>sports_esports</mat-icon>Speedrun</a>
      <a mat-menu-item routerLink="/gamenight" class="menu-item"><mat-icon svgIcon="gameNight"></mat-icon>Game Night</a>
      <button mat-menu-item type="button" class="last-menu-item" *ngIf="loggedInUserName(); let username" (click)="logout()">
        <mat-icon class="rotate-180">exit_to_app</mat-icon>Logout {{username}}
      </button>
    </mat-menu>
  </nav>

  <div id="mobile-navigation" class="mobile-navigation" *ngIf="mobileMenuOpen">
    <div class="page-container mobile-navigation-inner">
      <div class="mobile-section-links">
        <a class="mobile-nav-link" [routerLink]="['/']" fragment="projects" (click)="closeMobileMenu()">Projects</a>
        <a class="mobile-nav-link" [routerLink]="['/']" fragment="skills" (click)="closeMobileMenu()">Skills</a>
        <a class="mobile-nav-link" [routerLink]="['/']" fragment="about" (click)="closeMobileMenu()">About</a>
        <a class="mobile-nav-link" [routerLink]="['/']" fragment="contact" (click)="closeMobileMenu()">Contact</a>
        <a class="mobile-nav-link" routerLink="/blog" (click)="closeMobileMenu()">Blog</a>
      </div>

      <div class="mobile-apps" aria-label="Project apps">
        <span class="mobile-apps-label">Project apps</span>
        <a routerLink="/bowling" (click)="closeMobileMenu()"><mat-icon svgIcon="bowling"></mat-icon>Bowling</a>
        <a routerLink="/yugioh" (click)="closeMobileMenu()"><mat-icon svgIcon="yugioh"></mat-icon>Yu-Gi-Oh</a>
        <a routerLink="/initiative" (click)="closeMobileMenu()"><mat-icon>repeat_one</mat-icon>Initiative</a>
        <a routerLink="/speedrun" (click)="closeMobileMenu()"><mat-icon>sports_esports</mat-icon>Speedrun</a>
        <a routerLink="/gamenight" (click)="closeMobileMenu()"><mat-icon svgIcon="gameNight"></mat-icon>Game Night</a>
      </div>

      <button type="button" class="mobile-logout" *ngIf="loggedInUserName(); let username" (click)="logout()">
        <mat-icon class="rotate-180">exit_to_app</mat-icon>Logout {{username}}
      </button>
    </div>
  </div>
</header>
