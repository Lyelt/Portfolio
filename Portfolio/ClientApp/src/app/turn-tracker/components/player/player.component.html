<form (ngSubmit)="emitPlayerEndedTurn()">
  <div
    class="player-card app-panel mt-3 flex items-center justify-between gap-2"
    [class.animate-border]="player.isActive"
    [attr.aria-current]="player.isActive ? 'step' : null">
    <button
      *ngIf="!player.isActive"
      type="button"
      class="icon-button"
      title="Remove {{player.name}}"
      attr.aria-label="Remove {{player.name}}"
      (click)="emitPlayerRemoved()"
      [@fade]>
      <mat-icon aria-hidden="true">clear</mat-icon>
    </button>

    <button
      *ngIf="player.isActive"
      title="Previous player"
      aria-label="Previous player"
      class="icon-button"
      type="button"
      (click)="emitPlayerNavigatedBackward()"
      [@slideButtonLeft]>
      <mat-icon aria-hidden="true">navigate_before</mat-icon>
    </button>

    <p class="min-w-0 flex-1 truncate px-2 text-left font-semibold">{{player.name}}</p>

    <span *ngIf="!player.isActive" class="order-badge" [@fade] aria-label="Order {{player.order}}">{{player.order}}</span>

    <button
      *ngIf="player.isActive"
      title="Next player"
      aria-label="Next player"
      class="icon-button"
      type="submit"
      [@slideButtonRight]>
      <mat-icon aria-hidden="true">navigate_next</mat-icon>
    </button>
  </div>
</form>
