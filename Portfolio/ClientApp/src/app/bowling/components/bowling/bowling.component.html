<div class="flex flex-col justify-center md:px-8">
  <div class="mb-6">
    <div class="flex items-center justify-between px-4 mb-6">
      <span class="opacity-0"></span>
      <h1 class="font-bold text-2xl">Bowling Scores</h1>
      <span class="opacity-0" *ngIf="!currentUserId"></span>
      <button type="button" class="icon-button" *ngIf="currentUserId" [matMenuTriggerFor]="menu" aria-label="Open bowling menu">
        <mat-icon>menu</mat-icon>
      </button>
    </div>
    <mat-menu #menu="matMenu">
      <button type="button" mat-menu-item class="menu-item" (click)="setView('overview')" [ngClass]="{'bg-indigo-100 dark:bg-gray-700': view === 'overview'}"><mat-icon>score</mat-icon>Overview</button>
      <button type="button" mat-menu-item class="menu-item" (click)="setView('stats')" [ngClass]="{'bg-indigo-100 dark:bg-gray-700': view === 'stats'}"><mat-icon>query_stats</mat-icon>Stats Report</button>
      <button type="button" mat-menu-item class="menu-item" (click)="setView('games')" [ngClass]="{'bg-indigo-100 dark:bg-gray-700': view === 'games'}"><mat-icon>view_list</mat-icon>View Games</button>
      <button type="button" mat-menu-item class="menu-item" (click)="setView('edit')" [ngClass]="{'bg-indigo-100 dark:bg-gray-700': view === 'edit'}" *ngIf="userCanEdit()"><mat-icon>edit</mat-icon>Add Games</button>
      <button type="button" mat-menu-item class="menu-item" (click)="currentUserId = null"><mat-icon>people_alt</mat-icon>Change Bowler</button>
    </mat-menu>
    <div class="max-w-md px-6 mx-auto" *ngIf="!currentUserId">
      <app-bowling-select-user [initialUserId]="currentUserId" [label]="'Choose bowler...'" (selectionChange)="selectUser($event)"></app-bowling-select-user>
    </div>
  </div>
  <div *ngIf="currentUserId" class="flex flex-col">
    <div class="container mx-auto max-w-6xl px-4">
      <bowling-filters></bowling-filters>
      <div *ngIf="dataFound">
        <div *ngIf="view === 'overview'">
          <div class="mb-8">
            <app-bowling-stat statCategory="Overall"></app-bowling-stat>
          </div>
          <app-bowling-chart [category]="currentSeriesCategory" (dataPointClicked)="showSessionDetails($event)"></app-bowling-chart>
        </div>
        <div *ngIf="view === 'stats'">
          <bowling-stats></bowling-stats>
        </div>
        <div *ngIf="view ==='games'">
          <app-bowling-view-games></app-bowling-view-games>
        </div>
      </div>
      <div *ngIf="view === 'edit'">
        <app-bowling-start-session></app-bowling-start-session>
      </div>
      <div *ngIf="!dataFound" class="flex justify-center">
        <div class="app-panel flex items-center justify-center space-x-2 font-medium">
          <mat-icon>help_outline</mat-icon>
          <p>No data found for this criteria.</p>
        </div>
      </div>
    </div>
  </div>
</div>
