<div *ngIf="!openSession">
    <div class="flex max-h-96 flex-col space-y-3 overflow-y-auto sm:max-h-screen">
        <button type="button" *ngFor="let session of getSessionPage()" class="app-panel flex flex-col text-left" (click)="open(session)">
            <div class="flex flex-col">
                <div class="flex justify-between pb-2">
                    <span class="font-bold">{{session.date | date:'fullDate':'UTC'}}</span>
                    <div class="flex">
                        <span class="mr-1">Total</span>
                        <span class="font-bold">{{getSessionTotal(session)}}</span>
                        <mat-icon>keyboard_arrow_right</mat-icon>
                    </div>
                </div>
                <div class="flex flex-wrap space-x-2">
                    <span *ngFor="let game of session.games" class="rounded-lg bg-indigo-600 px-2 py-1 text-indigo-50 dark:bg-indigo-700 dark:text-indigo-50">
                        {{game.totalScore}}
                    </span>
                </div>
            </div>
        </button>
    </div>
    <div class="flex flex-col gap-3 pt-8 text-sm sm:flex-row sm:items-center sm:justify-between sm:text-base">
        <span>Showing <span class="font-bold">{{start}}</span> to <span class="font-bold">{{end}}</span> of <span class="font-bold">{{sessions.length}}</span> results</span>
        <div class="flex gap-2">
            <button type="button" class="btn btn-secondary" [disabled]="pageNumber === 1" (click)="setPage(pageNumber - 1)">Previous</button>
            <button type="button" class="btn btn-secondary" [disabled]="end >= sessions.length" (click)="setPage(pageNumber + 1)">Next</button>
        </div>
    </div>
</div>
<div *ngIf="openSession">
    <button type="button" class="btn btn-ghost" (click)="back()">&larr; Back</button>
    <app-bowling-add-game [session]="openSession" readOnly="true"></app-bowling-add-game>
</div>
