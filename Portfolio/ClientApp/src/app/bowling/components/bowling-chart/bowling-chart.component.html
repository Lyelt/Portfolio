<div class="chart-container app-panel overflow-hidden p-2 sm:p-4">
  <ngx-charts-line-chart
                         *ngIf="!dataLoading"
                         [scheme]="colorScheme"
                         schemeType="ordinal"
                         [results]="bowlingData"
                         [legend]="true"
                         [legendTitle]=null
                         [legendPosition]=null
                         gradient="false"
                         xAxis="true"
                         yAxis="true"
                         showXAxisLabel="true"
                         [yAxisLabel]="yAxisLabel"
                         autoScale="true"
                         timeline="true"
                         showGridLines="true"
                         [curve]="curve"
                         class="chart-line-selector">
  </ngx-charts-line-chart>
</div>
<div class="flex flex-col justify-center" *ngIf="dataLoading">
  <mat-progress-spinner class="self-center my-6" color="accent" mode="indeterminate"></mat-progress-spinner>
</div>
