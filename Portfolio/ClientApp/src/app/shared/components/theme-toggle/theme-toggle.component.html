<button type="button" class="icon-button theme-toggle" (click)="toggleDarkMode()"
        [attr.aria-label]="theme === 'dark' ? 'Use light theme' : 'Use dark theme'"
        [title]="theme === 'dark' ? 'Use light theme' : 'Use dark theme'">
  <mat-icon aria-hidden="true">{{theme === 'dark' ? 'light_mode' : 'dark_mode'}}</mat-icon>
</button>
