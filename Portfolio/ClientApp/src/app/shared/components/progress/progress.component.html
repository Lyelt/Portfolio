<div class="flex flex-col w-full">
    <span *ngIf="showNumbers" class="text-muted mb-1.5 text-right text-xs font-semibold tracking-wide" aria-hidden="true">{{complete}}/{{total}}</span>
    <div
      class="progress-track"
      role="progressbar"
      aria-label="Completion progress"
      aria-valuemin="0"
      aria-valuemax="100"
      [attr.aria-valuenow]="normalizedPercentage"
      [attr.aria-valuetext]="progressValueText">
        <div
          [style.width.%]="normalizedPercentage"
          class="progress-fill"
          [ngClass]="{'progress-low': normalizedPercentage < 50, 'progress-medium': normalizedPercentage >= 50 && normalizedPercentage < 80, 'progress-high': normalizedPercentage >= 80}"></div>
    </div>
</div>
