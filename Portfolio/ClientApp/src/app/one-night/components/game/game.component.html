<section class="page-container flex flex-col items-center">
  <header class="mb-8 text-center">
    <p class="eyebrow">Game tools</p>
    <h1 class="page-title mt-1 font-mono uppercase">One Night Custom</h1>
  </header>

  <div class="grid w-full grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-4" *ngIf="status === 'stopped'" aria-label="Choose roles">
    <button type="button"
            *ngFor="let role of roles"
            class="role-option surface-card flex min-h-24 items-end justify-center p-4 text-center text-xs font-bold uppercase tracking-wide sm:text-sm"
            [class.role-selected]="role.selected"
            [attr.aria-pressed]="role.selected"
            (click)="toggleRoleSelected(role)">
      <span>{{role.name}}</span>
    </button>
  </div>

  <div *ngIf="status !== 'stopped'" class="app-panel w-full max-w-2xl text-center" role="status" aria-live="polite">
    <p class="text-muted font-semibold">{{audioStatus}}</p>
    <app-monkey class="mt-4 block"></app-monkey>
  </div>

  <div class="mt-6 flex flex-wrap justify-center gap-3">
    <button type="button" class="btn btn-primary" (click)="start()" *ngIf="status === 'stopped'">Start {{selectedRoleCount}}</button>
    <button type="button" class="btn btn-primary" (click)="resume()" *ngIf="status === 'paused'">Resume</button>
    <button type="button" class="btn btn-secondary" (click)="pause()" *ngIf="status === 'started'">Pause</button>
    <button type="button" class="btn btn-secondary" (click)="stop()" *ngIf="status === 'started' || status === 'paused'">Stop</button>
  </div>
</section>
