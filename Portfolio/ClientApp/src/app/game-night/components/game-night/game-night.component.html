<div class="game-night-shell relative min-h-screen select-none">
  <header class="game-night-header fixed inset-x-0 top-0 z-999 border-b">
    <div class="page-container flex min-h-16 items-center gap-2 sm:gap-4">
      <a class="game-night-brand icon-button sm:w-auto sm:px-3" routerLink="/gamenight" aria-label="Game Night home">
        <mat-icon aria-hidden="true">celebration</mat-icon>
        <span class="hidden text-sm font-bold sm:inline">Game Night</span>
      </a>

      <nav class="flex min-w-0 flex-1 items-center justify-center gap-1" aria-label="Game Night">
        <a
          class="game-night-nav-link"
          routerLink="/gamenight"
          [ngClass]="{'game-night-nav-link--active': isActive('home') || isActive(undefined)}"
        >Home</a>
        <a
          class="game-night-nav-link"
          routerLink="/gamenight/games"
          [ngClass]="{'game-night-nav-link--active': isActive('games')}"
        >Games</a>
        <a
          class="game-night-nav-link"
          routerLink="/gamenight/meals"
          [ngClass]="{'game-night-nav-link--active': isActive('meals')}"
        >Meals</a>
      </nav>

      <app-theme-toggle class="shrink-0"></app-theme-toggle>
    </div>
  </header>

  <div class="game-night-content page-container">
    <app-game-night-home *ngIf="isActive('home') || isActive(undefined)"></app-game-night-home>
    <app-games *ngIf="isActive('games')"></app-games>
    <app-meals *ngIf="isActive('meals')"></app-meals>
  </div>

  <footer class="game-night-schedule-bar fixed inset-x-0 bottom-0 z-999 border-t" aria-label="Game Night schedule">
    <app-game-night-schedule></app-game-night-schedule>
  </footer>
</div>
