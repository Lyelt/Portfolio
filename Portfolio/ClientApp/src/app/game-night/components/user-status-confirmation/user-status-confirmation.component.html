<div class="fixed inset-0 z-topmost grid min-h-full place-items-center overflow-y-auto bg-black/60 p-4 backdrop-blur-sm sm:p-6" *ngIf="gnService.skippingNight" (click)="closeModal()">
  <div
    class="surface-card relative w-full max-w-lg overflow-hidden text-sm sm:text-base"
    role="dialog"
    aria-modal="true"
    aria-labelledby="schedule-conflict-title"
    aria-describedby="schedule-conflict-description"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (click)="$event.stopPropagation()"
  >
    <button class="icon-button absolute right-3 top-3" type="button" (click)="closeModal()" aria-label="Close dialog">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>

    <div class="px-6 pb-8 pt-6 sm:px-8 sm:pb-10 sm:pt-8">
      <div class="mb-4 flex items-center gap-3 pr-10">
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-pink-50 text-pink-600 dark:bg-gray-800 dark:text-pink-300">
          <mat-icon aria-hidden="true">event_busy</mat-icon>
        </span>
        <h2 id="schedule-conflict-title" class="text-lg font-bold sm:text-xl">Schedule Conflict!</h2>
      </div>
      <p id="schedule-conflict-description" class="text-muted leading-7">
        You're going to miss some or all of your night. Would you like to skip your night?
      </p>
    </div>

    <div class="flex flex-col gap-3 border-t border-gray-200 bg-gray-50 px-5 py-4 dark:border-gray-700 dark:bg-gray-800 sm:flex-row sm:items-center sm:justify-between sm:px-6">
      <button type="button" class="btn btn-secondary w-full sm:w-auto" (click)="cancel()">Cancel Night</button>
      <div class="grid grid-cols-2 gap-3 sm:flex">
        <button type="button" class="btn btn-ghost" (click)="closeModal()">No</button>
        <button type="button" class="btn btn-primary" (click)="skip()">Yes</button>
      </div>
    </div>
  </div>
</div>
