<div class="px-3 py-2 sm:px-6 sm:py-3">
  <ol class="schedule-list mx-auto flex max-w-4xl items-center gap-2 overflow-x-auto pb-1 sm:gap-3" aria-label="Upcoming game nights">
    <li *ngFor="let gn of gameNights" class="shrink-0">
      <button
        type="button"
        class="schedule-option flex min-h-14 min-w-20 flex-col items-center justify-center rounded-xl border px-3 py-2 text-center font-semibold sm:min-h-16 sm:min-w-24"
        [class.schedule-option--selected]="gameNightIsSelected(gn)"
        [attr.aria-pressed]="gameNightIsSelected(gn)"
        [attr.aria-label]="(gn.date | date:'MMMM d') + ', ' + (gn.user?.userName || 'unassigned')"
        (click)="selectGameNight(gn)"
      >
        <span class="text-xs uppercase tracking-wide">{{gn.date | date:'MMM d'}}</span>
        <span class="max-w-20 truncate text-sm">{{gn.user?.userName}}</span>
      </button>
    </li>
  </ol>
</div>
