<section *ngIf="getSelectedGameNight()" class="mx-auto max-w-3xl">
  <header class="mb-6 text-center sm:mb-8">
    <p class="eyebrow justify-center">
      <mat-icon aria-hidden="true">restaurant</mat-icon>
      Meal plan
    </p>
    <h1 class="mt-3 flex flex-col text-xl font-semibold sm:text-2xl">
      <span *ngIf="!getSelectedGameNight().meal">{{userCanSetMeal() ? "Select the meal" : "Viewing meal options"}} for</span>
      <span *ngIf="getSelectedGameNight().meal">We're having <span class="emphasis">{{getSelectedGameNight().meal.name | lowercase}}</span> on</span>
      <span class="emphasis mt-1">{{getSelectedGameNight().date | date: 'EEEE, MMMM d'}}</span>
    </h1>
  </header>

  <div class="app-panel">
    <ul class="max-h-[48vh] space-y-2 overflow-y-auto pr-1" aria-label="Meals">
      <li *ngFor="let meal of meals">
        <button
          type="button"
          class="flex min-h-12 w-full items-center justify-between gap-3 rounded-xl border border-transparent px-4 py-3 text-left hover:border-indigo-200 hover:bg-indigo-50 dark:hover:border-gray-600 dark:hover:bg-gray-800"
          [ngClass]="{'border-indigo-200 bg-indigo-50 font-bold dark:border-indigo-700 dark:bg-gray-800': getSelectedGameNight().meal?.id === meal.id}"
          [attr.aria-pressed]="getSelectedGameNight().meal?.id === meal.id"
          [disabled]="!userCanSetMeal()"
          (click)="setMeal(meal)"
        >
          <span class="min-w-0 break-words">{{meal.name}}</span>
          <mat-icon class="shrink-0 text-pink-600 dark:text-pink-300" *ngIf="getSelectedGameNight().meal?.id === meal.id" aria-hidden="true">check_circle</mat-icon>
        </button>
      </li>
    </ul>

    <div class="mt-5 border-t border-gray-200 pt-5 dark:border-gray-700">
      <button *ngIf="!addingMeal" class="btn btn-secondary" type="button" (click)="addingMeal = true">
        <mat-icon aria-hidden="true">add</mat-icon>
        <span>Add Meal</span>
      </button>

      <form [formGroup]="form" (ngSubmit)="form.valid && addMeal()" class="space-y-4" *ngIf="addingMeal">
        <div class="flex min-h-11 items-center justify-between gap-4">
          <h2 class="text-lg font-bold">Add Meal</h2>
          <button class="icon-button" type="button" (click)="addingMeal = false" aria-label="Close add meal form">
            <mat-icon aria-hidden="true">close</mat-icon>
          </button>
        </div>

        <div class="flex flex-col gap-3 sm:flex-row sm:items-end">
          <div class="min-w-0 flex-1">
            <label class="field-label" for="name">Meal</label>
            <input class="w-full" type="text" placeholder="Meal" id="name" formControlName="name" />
          </div>
          <button type="submit" class="btn btn-primary w-full sm:w-auto" [disabled]="!form.valid">Add</button>
        </div>
      </form>
    </div>
  </div>
</section>
