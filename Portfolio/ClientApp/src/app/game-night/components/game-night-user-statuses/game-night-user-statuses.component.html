<div class="relative p-4 sm:p-6">
  <div *ngIf="userStatusIsUnknown()" class="flex flex-col gap-3">
    <p class="text-muted mb-1 text-sm">Choose your status</p>

    <button
      type="button"
      class="flex min-h-12 w-full items-center gap-3 rounded-xl border border-green-200 bg-green-50 px-4 py-3 text-left font-semibold text-green-800 hover:bg-green-100 dark:border-green-800 dark:bg-gray-800 dark:text-green-200 dark:hover:bg-green-900/30"
      (click)="setUserStatus(0)"
    >
      <mat-icon aria-hidden="true">event_available</mat-icon>
      <span class="text-sm sm:text-base">I'm available</span>
    </button>

    <button
      type="button"
      class="flex min-h-12 w-full items-center gap-3 rounded-xl border border-yellow-200 bg-yellow-50 px-4 py-3 text-left font-semibold text-yellow-800 hover:bg-yellow-100 dark:border-yellow-800 dark:bg-gray-800 dark:text-yellow-200 dark:hover:bg-yellow-900/30"
      (click)="setUserStatus(1)"
    >
      <mat-icon aria-hidden="true">access_time</mat-icon>
      <span class="text-sm sm:text-base">I'm partially busy</span>
    </button>

    <button
      type="button"
      class="flex min-h-12 w-full items-center gap-3 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-left font-semibold text-red-800 hover:bg-red-100 dark:border-red-800 dark:bg-gray-800 dark:text-red-200 dark:hover:bg-red-900/30"
      (click)="setUserStatus(2)"
    >
      <mat-icon aria-hidden="true">event_busy</mat-icon>
      <span class="text-sm sm:text-base">I won't be there</span>
    </button>
  </div>

  <div *ngIf="!userStatusIsUnknown() || userStatus === undefined" class="w-full">
    <div class="mb-4 flex min-h-11 items-center justify-end" *ngIf="userStatus && !userStatusIsUnknown()">
      <button class="icon-button" type="button" (click)="setUserStatus(3)" aria-label="Edit my availability">
        <mat-icon aria-hidden="true">edit</mat-icon>
      </button>
    </div>

    <div class="grid gap-3 sm:grid-cols-2">
      <div *ngFor="let us of getUserStatuses()" class="rounded-xl border border-gray-200 bg-gray-50 p-3 dark:border-gray-700 dark:bg-gray-800">
        <div class="flex items-start justify-between gap-2 font-semibold">
          <span class="min-w-0 break-words">{{us.user?.userName}}</span>
          <mat-icon class="shrink-0 text-green-600 dark:text-green-300" *ngIf="us.status === 0" aria-hidden="true">event_available</mat-icon>
          <mat-icon class="shrink-0 text-yellow-600 dark:text-yellow-300" *ngIf="us.status === 1" aria-hidden="true">access_time</mat-icon>
          <mat-icon class="shrink-0 text-red-600 dark:text-red-300" *ngIf="us.status === 2" aria-hidden="true">event_busy</mat-icon>
          <mat-icon class="text-muted shrink-0" *ngIf="us.status === 3" aria-hidden="true">help_outline</mat-icon>
        </div>
        <span class="mt-1 block text-xs font-semibold tracking-wide text-green-700 dark:text-green-300" *ngIf="us.status === 0">Available</span>
        <span class="mt-1 block text-xs font-semibold tracking-wide text-yellow-700 dark:text-yellow-300" *ngIf="us.status === 1">Partially Busy</span>
        <span class="mt-1 block text-xs font-semibold tracking-wide text-red-700 dark:text-red-300" *ngIf="us.status === 2">Not Available</span>
        <span class="text-muted mt-1 block text-xs font-semibold tracking-wide" *ngIf="us.status === 3">Unknown</span>
      </div>
    </div>
  </div>
</div>
