<section class="page-container pb-10 pt-2 sm:pb-14 sm:pt-6">
  <div class="surface-card relative overflow-hidden px-6 py-10 sm:px-10 sm:py-14 lg:px-14">
    <div class="pointer-events-none absolute -bottom-10 left-0 right-0 opacity-25" aria-hidden="true">
      <app-background-icon></app-background-icon>
    </div>

    <div class="relative z-10 max-w-2xl">
      <p class="eyebrow">
        <mat-icon class="text-base" aria-hidden="true">auto_stories</mat-icon>
        Development notes
      </p>
      <h1 class="page-title mt-4">
        This is my <span class="text-indigo-600 dark:text-indigo-300">blog</span>.
      </h1>
      <p class="page-intro mt-4 text-base leading-7 sm:text-lg sm:leading-8">
        At least, it sort of resembles a blog. I'll be recording some thoughts about things I've created and learned as a developer.
      </p>
    </div>
  </div>
</section>

<section class="page-container pb-14 sm:pb-20" aria-label="Blog posts">
  <div class="mb-6 flex items-end justify-between gap-4 sm:mb-8">
    <div>
      <p class="eyebrow">Archive</p>
      <h2 class="mt-2 text-2xl font-bold tracking-tight sm:text-3xl">Thoughts from the build</h2>
    </div>
    <span class="text-muted hidden text-sm sm:inline">{{blogs.length}} posts</span>
  </div>

  <div class="grid gap-4 sm:grid-cols-2 lg:gap-6">
    <a
      *ngFor="let blog of blogs"
      [routerLink]="blog.link"
      class="surface-card group flex min-h-44 flex-col justify-between p-5 no-underline transition duration-200 hover:-translate-y-1 hover:border-indigo-300 hover:shadow-xl focus-visible:-translate-y-1 dark:hover:border-indigo-400 sm:p-6"
    >
      <p class="eyebrow text-pink-600 dark:text-pink-300">{{blog.date}}</p>
      <div class="mt-8 flex items-end justify-between gap-4">
        <h3 class="text-lg font-bold leading-snug tracking-tight text-gray-800 transition-colors group-hover:text-indigo-700 dark:text-gray-100 dark:group-hover:text-indigo-200 sm:text-xl">
          {{blog.title}}
        </h3>
        <mat-icon class="shrink-0 text-indigo-500 transition-transform duration-200 group-hover:translate-x-1 dark:text-indigo-300" aria-hidden="true">arrow_forward</mat-icon>
      </div>
    </a>
  </div>
</section>
