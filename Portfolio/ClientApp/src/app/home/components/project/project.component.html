<article class="project-card surface-card">
  <div class="project-card__body">
    <span class="project-card__icon" aria-hidden="true"><mat-icon>code</mat-icon></span>
    <h3>{{name}}</h3>
    <p>{{description}}</p>
  </div>
  <div class="project-card__actions">
    <a [href]="blogUrl" class="project-card__link">
      <mat-icon aria-hidden="true">menu_book</mat-icon><span>Read More</span>
    </a>
    <a [href]="githubUrl" target="_blank" rel="noopener noreferrer" class="project-card__link">
      <mat-icon aria-hidden="true">open_in_new</mat-icon><span>View on GitHub</span>
    </a>
  </div>
</article>
