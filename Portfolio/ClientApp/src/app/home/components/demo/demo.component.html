<article class="demo-card surface-card">
  <span class="demo-card__icon" aria-hidden="true"><mat-icon>play_circle_outline</mat-icon></span>
  <div class="demo-card__copy">
    <h3>{{name}}</h3>
    <p>{{description}}</p>
  </div>
  <div class="demo-card__actions">
    <a [href]="blogUrl" class="btn btn-ghost"><mat-icon aria-hidden="true">menu_book</mat-icon>Read More</a>
    <a [href]="demoUrl" class="btn btn-primary"><mat-icon aria-hidden="true">arrow_forward</mat-icon>View in Action</a>
  </div>
</article>
