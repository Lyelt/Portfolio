<article class="skill-card surface-card">
  <span class="skill-card__icon" aria-hidden="true"><mat-icon>auto_awesome</mat-icon></span>
  <h3>{{title}}</h3>
  <ul>
    <li *ngFor="let skill of skills">
      <mat-icon aria-hidden="true">check</mat-icon><span>{{skill}}</span>
    </li>
  </ul>
</article>
