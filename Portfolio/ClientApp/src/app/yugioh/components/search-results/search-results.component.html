<div class="mt-6">
  <div class="mr-8 hidden xl:inline fixed" [ngClass]="{'left-1/4': hoveredIndex % 3 === 0, 'right-1/4': (hoveredIndex + 2) % 3 === 0, 'right-0': (hoveredIndex + 1) % 3 === 0}" >
    <img *ngIf="hoveredCard" [src]="hoveredCard.card_Images[0].image_Url" alt="" aria-hidden="true" />
  </div>
    <div class="grid grid-cols-1 gap-4 lg:grid-cols-2 2xl:grid-cols-3 2xl:gap-x-6">
      <article *ngFor="let card of searchResults?.results; let i = index" class="surface-card flex min-w-0 items-start gap-2 p-3 sm:p-4">
        <button type="button" class="flex min-w-0 flex-1 items-start gap-3 text-left sm:gap-4" (click)="goToCard(card)" [attr.aria-label]="'View details for ' + card.name">
          <img class="w-24 flex-none rounded-lg sm:w-32" (mouseover)="hoveringCard(card, i)" (mouseleave)="stopHovering()" [src]="card.card_Images[0].image_Url" [alt]="card.name + ' card artwork'" loading="lazy" />
          <div class="flex min-w-0 flex-col break-words">
            <span class="mb-2 font-bold leading-snug">{{card.name}}</span>
            <span class="text-sm" *ngIf="getCardType(card) !== CardTypeEnum.Spell && getCardType(card) !== CardTypeEnum.Trap">{{card.attribute}} / {{card.race}}</span>
            <span class="text-sm" *ngIf="getCardType(card) !== CardTypeEnum.Spell && getCardType(card) !== CardTypeEnum.Trap">{{card.atk}}
              <span *ngIf="getCardType(card) !== CardTypeEnum.Link"> / {{card.def}}</span>
              <span *ngIf="getCardType(card) === CardTypeEnum.Link"> / Link {{card.linkVal}}</span>
            </span>
            <span class="text-sm" *ngIf="getCardType(card) === CardTypeEnum.Spell || getCardType(card) === CardTypeEnum.Trap">{{card.race}} {{card.type.slice(0, -5)}}</span>
          </div>
        </button>
        <div class="shrink-0">
          <button type="button" class="icon-button" [matMenuTriggerFor]="setMenu" [attr.aria-label]="'Add ' + card.name + ' to a collection'">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #setMenu="matMenu">
            <span mat-menu-item class="menu-item" [matMenuTriggerFor]="collectionMenu" *ngFor="let set of card.card_Sets">
              <span class="font-bold mr-1">${{set.set_Price}}</span>
              <span>{{set.set_Code}} - {{set.set_Rarity}}</span>
              <mat-menu #collectionMenu="matMenu">
                <span mat-menu-item class="menu-item" [matMenuTriggerFor]="sectionMenu" *ngFor="let collection of collections" >
                  <span>{{collection.name}}</span>
                  <mat-menu #sectionMenu="matMenu">
                    <button type="button" mat-menu-item class="menu-item" *ngFor="let section of collection.sections" (click)="addCardToCollection(card, set, collection, section)">{{section}}</button>
                  </mat-menu>
                </span>
              </mat-menu>
            </span>
          </mat-menu>
        </div>
      </article>
    </div>
  </div>
  
  <div class="flex flex-col gap-3 pt-8 text-sm sm:flex-row sm:items-center sm:justify-between sm:text-base">
    <span>Showing <span class="font-bold">{{start}}</span> to <span class="font-bold">{{end}}</span> of <span class="font-bold">{{searchResults?.totalResults}}</span> results</span>
    <div class="flex gap-2">
        <button type="button" class="btn btn-secondary" [disabled]="pageNumber <= 1" (click)="previous()">Previous</button>
        <button type="button" class="btn btn-secondary" [disabled]="!searchResults || end >= searchResults.totalResults" (click)="next()">Next</button>
    </div>
</div>
