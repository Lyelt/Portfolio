<div class="pt-8">
    <div class="mb-8 grid grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-3">
        <button type="button" class="btn btn-ghost" (click)="closed.emit()">&larr; Back</button>
        <h2 class="truncate text-center text-lg font-bold md:text-2xl">{{star.name}}</h2>
        <span class="h-11 w-11" aria-hidden="true"></span>
    </div>
    <div>
        <!-- tab labels -->
        <nav class="-mx-4 mb-12 flex items-center justify-start gap-2 overflow-x-auto px-4 pb-2 text-sm sm:mx-0 sm:justify-center sm:px-0 md:mb-16 md:text-base" aria-label="Star detail views">
            <button type="button" class="nav-link nav-link-hover flex-none text-center" [attr.aria-pressed]="selectedTab === 'time'" [ngClass]="{'active font-bold': selectedTab === 'time'}" (click)="selectedTab = 'time'">Time Comparison</button>
            <button type="button" class="nav-link nav-link-hover flex-none text-center" [attr.aria-pressed]="selectedTab === 'edit'" [ngClass]="{'active font-bold': selectedTab === 'edit'}" (click)="selectedTab = 'edit'">Edit</button>
            <button type="button" class="nav-link nav-link-hover flex-none text-center" [attr.aria-pressed]="selectedTab === 'archive'" [ngClass]="{'active font-bold': selectedTab === 'archive'}" (click)="selectedTab = 'archive'">Archive</button>
            <button type="button" class="nav-link nav-link-hover flex-none text-center" [attr.aria-pressed]="selectedTab === 'rta'" [ngClass]="{'active font-bold': selectedTab === 'rta'}" (click)="selectedTab = 'rta'">RTA Guide</button>
        </nav>

        <div class="grid grid-cols-1 gap-12 md:grid-cols-2 md:gap-6" *ngIf="selectedTab === 'time'">
            <div *ngFor="let runner of runners" class="md:first:text-right">
                <div *ngIf="getStarTime(runner); let time" class="flex flex-col">
                    <span class="uppercase font-medium tracking-wide pb-4">{{runner.userName}}</span>
                    <span class="pb-4" [ngClass]="{'font-bold tracking-tight text-indigo-600 dark:text-pink-400' : starTimeIsFastest(time)}">{{time.timeDisplay}}</span>
                    <div class="surface-card aspect-video overflow-hidden">
                        <iframe *ngIf="time.videoUrl" class="h-full w-full" [src]="time.videoUrl | safeYt" [title]="runner.userName + ' run video for ' + star.name" loading="lazy" allowfullscreen></iframe>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-12 md:grid-cols-2 md:gap-6" *ngIf="selectedTab === 'edit'">
            <div *ngFor="let runner of runners; let i = index" class="flex flex-col md:first:text-right">
                <span class="uppercase font-medium tracking-wide pb-4">{{runner.userName}}</span>
                <app-edit-star class="hidden md:block" [starTime]="getStarTime(runner)" [runnerName]="runner.userName" [alignment]="i === 0 ? 'right' : 'left'"></app-edit-star>
                <app-edit-star class="md:hidden" [starTime]="getStarTime(runner)" [runnerName]="runner.userName" alignment="left"></app-edit-star>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-12 md:grid-cols-2 md:gap-6" *ngIf="selectedTab === 'archive'">
            <div *ngFor="let runner of runners" class="flex flex-col">
                <span class="uppercase tracking-wide mb-6 text-center">{{runner.userName}}</span>
                <app-archive [star]="star" [runner]="runner"></app-archive>
            </div>
        </div>

        <div *ngIf="selectedTab === 'rta'">
            <div class="surface-card h-[70vh] min-h-96 w-full overflow-hidden" *ngIf="star.rtaGuideUrl">
                <iframe class="h-full w-full" [src]="star.rtaGuideUrl | safe" [title]="'RTA guide for ' + star.name" loading="lazy"></iframe>
            </div>
        </div>
    </div>
</div>
