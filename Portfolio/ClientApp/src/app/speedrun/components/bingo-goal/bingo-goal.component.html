<button type="button"
        class="icon-button"
        (click)="toggle()"
        [attr.aria-pressed]="checked"
        [attr.aria-label]="checked ? 'Mark goal incomplete' : 'Mark goal complete'">
  <mat-icon *ngIf="!checked">{{uncheckedIcon}}</mat-icon>
  <mat-icon *ngIf="checked" class="text-yellow-500 dark:text-yellow-300">{{checkedIcon}}</mat-icon>
</button>
