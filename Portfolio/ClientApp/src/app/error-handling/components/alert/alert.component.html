<div
  class="fixed inset-0 z-topmost flex min-h-full items-start justify-center overflow-y-auto bg-gray-950 bg-opacity-60 px-4 py-6 sm:items-center"
  *ngIf="alertService.isVisible"
  (click)="closeModal()">
  <section
    class="alert-dialog surface-card relative w-full max-w-xl overflow-hidden"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="alert-title"
    aria-describedby="alert-message"
    tabindex="-1"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (click)="$event.stopPropagation()">
    <button
      type="button"
      class="icon-button absolute right-3 top-3"
      aria-label="Close alert"
      (click)="closeModal()">
      <mat-icon aria-hidden="true">close</mat-icon>
    </button>

    <div class="p-5 pr-16 sm:p-7 sm:pr-20">
      <div class="alert-heading flex items-start gap-3">
        <span class="alert-icon" aria-hidden="true">
          <mat-icon>error_outline</mat-icon>
        </span>
        <div class="min-w-0">
          <h2 id="alert-title" class="text-lg font-extrabold sm:text-xl">{{alertService.alertTitle}}</h2>
          <p id="alert-message" class="mt-3 break-words text-sm leading-relaxed sm:text-base">{{alertService.alertMessage}}</p>
        </div>
      </div>
    </div>

    <div class="alert-actions flex flex-col gap-3 p-4 sm:flex-row sm:justify-end">
      <a
        class="btn btn-ghost w-full sm:w-auto"
        target="_blank"
        rel="noopener noreferrer"
        [href]="getGithubIssueUrl()">Report Issue</a>
      <button type="button" class="btn btn-primary w-full sm:w-auto" (click)="closeModal()">OK</button>
    </div>
  </section>
</div>
