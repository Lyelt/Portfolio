<section class="page-container py-8 sm:py-12" aria-labelledby="hash-title">
  <div class="content-container">
    <div class="surface-card p-5 sm:p-8">
      <div class="mb-6">
        <p class="eyebrow">Utility</p>
        <h1 id="hash-title" class="mt-2 text-3xl font-extrabold tracking-tight">Password Hash</h1>
      </div>

      <form (ngSubmit)="hash()" class="flex flex-col gap-3 sm:flex-row sm:items-end" name="hash">
        <div class="min-w-0 flex-1">
          <label for="hash-password" class="field-label">Password</label>
          <input
            id="hash-password"
            class="w-full px-4"
            type="password"
            placeholder="Enter password"
            autocomplete="new-password"
            [(ngModel)]="input"
            name="pw"
            required />
        </div>
        <button type="submit" class="btn btn-primary w-full sm:w-auto">Go</button>
      </form>

      <div class="app-panel mt-8">
        <div class="flex items-center justify-between gap-3">
          <label for="password-hash-output" class="field-label mb-0">Password Hash Below</label>
          <button
            type="button"
            class="btn btn-ghost shrink-0"
            (click)="copyToClipboard()"
            [disabled]="!hashValue"
            aria-label="Copy password hash">
            <mat-icon aria-hidden="true">file_copy</mat-icon>
            <span>Copy</span>
          </button>
        </div>
        <input
          id="password-hash-output"
          class="mt-3 w-full px-4 font-mono text-sm"
          type="text"
          readonly
          [value]="hashValue"
          (click)="copyToClipboard()"
          aria-describedby="hash-copy-status" />
        <p id="hash-copy-status" class="text-muted mt-2 min-h-6 text-sm" aria-live="polite">{{copyStatus}}</p>
      </div>
    </div>
  </div>
</section>
