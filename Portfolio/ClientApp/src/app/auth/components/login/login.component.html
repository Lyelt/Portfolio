<section class="page-container py-8 sm:py-12" aria-labelledby="login-title">
  <div class="content-container max-w-xl">
    <div class="surface-card p-5 sm:p-8">
      <div class="mb-6 text-center">
        <p class="eyebrow">Welcome back</p>
        <h1 id="login-title" class="mt-2 text-3xl font-extrabold tracking-tight">Login</h1>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="space-y-5">
          <div>
            <label for="login-username" class="field-label">Username</label>
            <input
              id="login-username"
              class="w-full px-4"
              type="text"
              name="username"
              autocomplete="username"
              formControlName="username"
              [attr.aria-invalid]="submitted && f.username.errors ? 'true' : null"
              [attr.aria-describedby]="submitted && f.username.errors ? 'username-error' : null"
              [ngClass]="{ 'border-red-600 ring-2 ring-red-200 dark:ring-red-900': submitted && f.username.errors }" />
            <p id="username-error" *ngIf="submitted && f.username.errors" class="mt-2 text-sm text-red-700 dark:text-red-300">
              Username is required.
            </p>
          </div>

          <div>
            <label for="login-password" class="field-label">Password</label>
            <input
              id="login-password"
              class="w-full px-4"
              type="password"
              name="password"
              autocomplete="current-password"
              formControlName="password"
              [attr.aria-invalid]="submitted && f.password.errors ? 'true' : null"
              [attr.aria-describedby]="submitted && f.password.errors ? 'password-error' : null"
              [ngClass]="{ 'border-red-600 ring-2 ring-red-200 dark:ring-red-900': submitted && f.password.errors }" />
            <p id="password-error" *ngIf="submitted && f.password.errors" class="mt-2 text-sm text-red-700 dark:text-red-300">
              Password is required.
            </p>
          </div>
        </div>

        <div class="mt-7 grid gap-3 sm:grid-cols-2">
          <button type="submit" class="btn btn-primary w-full" [disabled]="loading">Login</button>
          <button type="button" (click)="guestLogin()" class="btn btn-secondary w-full" [disabled]="loading">
            Continue as guest &rarr;
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
