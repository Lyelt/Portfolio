name: PR checks

on:
  pull_request:
    branches: [master, staging]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Build and test application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Portfolio/ClientApp/package-lock.json

      - name: Restore dependencies
        run: |
          dotnet restore Portfolio.sln
          npm ci --prefix Portfolio/ClientApp --ignore-scripts --no-audit --no-fund

      - name: Verify dependency health
        run: |
          dotnet list Portfolio.sln package --vulnerable --include-transitive
          npm audit --prefix Portfolio/ClientApp --audit-level=high

      - name: Validate deployment hard cut
        run: |
          bash -n \
            deploy/portfolio/deploy-portfolio \
            deploy/portfolio/backup-production \
            host/install-portfolio-linux-files.sh \
            host/install-vm-files.sh
          bash tests/install-portfolio-linux-files-test.sh
          grep -Fq "readonly database_volume='portfolio-staging-postgres-data'" \
            deploy/portfolio/deploy-portfolio
          grep -Fq "Current release is missing its immutable image marker." \
            deploy/portfolio/deploy-portfolio
          grep -Fq "stops the failed application" HOSTING_SETUP.md
          grep -Fq 'DROP SCHEMA IF EXISTS legacy CASCADE;' \
            'PortfolioDatabase/scripts/1.0.0/009 - Remove Legacy Schema.sql'
          grep -Fq "schema_name = '\\''legacy'\\''" \
            deploy/portfolio/backup-production
          grep -Fq "assert_canonical_database_schema" \
            deploy/portfolio/deploy-portfolio
          ! grep -RiqE \
            'staging-database-volume|legacy transition|restoring application image|production-import-complete' \
            deploy host HOSTING_SETUP.md

      - name: Build frontend and backend
        run: |
          npm run build --prefix Portfolio/ClientApp -- --configuration production
          dotnet build Portfolio.sln --configuration Release --no-restore

      - name: Rehearse database migration
        run: bash tests/schema-migration-test.sh

      - name: Run tests
        run: |
          npm test --prefix Portfolio/ClientApp -- --watch=false
          dotnet test Portfolio.sln --configuration Release --no-build \
            --logger "trx;LogFileName=tests.trx" \
            --results-directory artifacts/test-results

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-failure-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/test-results/

  container:
    name: Validate runtime image and Compose model
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate non-root runtime content
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint /bin/sh portfolio:ci -ceu \
            'test "$(id -u)" -ne 0; test -r /app/appsettings.json; test -r /app/Portfolio.dll; test -r /app/dbup/PortfolioDatabase.dll'

      - name: Validate Compose
        env:
          DEPLOY_ENV: staging
          APP_ENVIRONMENT: Staging
          DB_VOLUME_NAME: portfolio-ci-postgres-data
          IMAGE_REF: portfolio:ci
          WEB_ALIAS: portfolio-ci-web
        run: |
          docker compose \
            --env-file deploy/secrets/portfolio-staging.env.example \
            --file deploy/portfolio/compose.yml \
            config --quiet
