name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Build and test application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Portfolio/ClientApp/package-lock.json

      - name: Restore dependencies
        run: |
          dotnet restore Portfolio.sln
          npm ci --prefix Portfolio/ClientApp --ignore-scripts --no-audit --no-fund

      - name: Verify dependency health
        run: |
          dotnet list Portfolio.sln package --vulnerable --include-transitive
          npm audit --prefix Portfolio/ClientApp --omit=dev --audit-level=high

      - name: Validate deployment adapters
        run: |
          bash -n \
            deploy/portfolio/deploy-portfolio \
            deploy/portfolio/backup-production \
            host/install-vm-files.sh
          jq -e '
            .schemaVersion == "hosting-dashboard.config.v1"
            and .application == "portfolio"
            and (.fields | length > 0)
          ' hosting-dashboard.config.v1.json

      - name: Build frontend and backend
        run: |
          npm run build --prefix Portfolio/ClientApp -- --configuration production
          dotnet build Portfolio.sln --configuration Release --no-restore

      - name: Run tests
        run: |
          npm test --prefix Portfolio/ClientApp -- --watch=false
          dotnet test Portfolio.sln --configuration Release --no-build

  container:
    name: Validate runtime image and Compose model
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate non-root runtime content
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint /bin/sh portfolio:ci -ceu \
            'test "$(id -u)" -ne 0; test -r /app/appsettings.json; test -r /app/Portfolio.dll; test -r /app/dbup/PortfolioDatabase.dll'

      - name: Validate Compose
        env:
          DEPLOY_ENV: staging
          APP_ENVIRONMENT: Staging
          DB_VOLUME_NAME: portfolio-ci-postgres-data
          IMAGE_REF: portfolio:ci
          WEB_ALIAS: portfolio-ci-web
        run: |
          docker compose \
            --env-file deploy/secrets/portfolio-staging.env.example \
            --file deploy/portfolio/compose.yml \
            config --quiet
