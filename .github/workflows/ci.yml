name: PR checks

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  application:
    name: Build and test application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Portfolio/ClientApp/package-lock.json

      - name: Restore dependencies
        run: |
          dotnet restore Portfolio.sln
          npm ci --prefix Portfolio/ClientApp --ignore-scripts --no-audit --no-fund

      - name: Verify dependency health
        run: |
          dotnet list Portfolio.sln package --vulnerable --include-transitive
          npm audit --prefix Portfolio/ClientApp --audit-level=high

      - name: Verify source formatting
        run: dotnet format Portfolio.sln --verify-no-changes --no-restore

      - name: Validate deployment hard cut
        run: |
          bash -n \
            deploy/portfolio/deploy-portfolio \
            deploy/portfolio/backup-production \
            deploy/portfolio/restore-production \
            host/install-portfolio-linux-files.sh
          bash tests/install-portfolio-linux-files-test.sh
          grep -Fq "readonly database_volume='portfolio-staging-postgres-data'" \
            deploy/portfolio/deploy-portfolio
          grep -Fq "Current release is missing its immutable image marker." \
            deploy/portfolio/deploy-portfolio
          grep -Fq "stops the failed application" HOSTING_SETUP.md
          grep -Fq 'DROP SCHEMA IF EXISTS legacy CASCADE;' \
            'PortfolioDatabase/scripts/1.0.0/009 - Remove Legacy Schema.sql'
          grep -Fq 'schema-contract.sql' deploy/portfolio/deploy-portfolio
          grep -Fq 'schema-contract.sql' deploy/portfolio/backup-production
          grep -Fq 'schema-contract.sql' tests/schema-migration-test.sh
          grep -Fq "Unexpected Portfolio tables" \
            deploy/portfolio/schema-contract.sql
          grep -Fq "assert_canonical_database_schema" \
            deploy/portfolio/deploy-portfolio
          grep -Fq "database.dump SOURCE_SHA IMAGE_REF SHA256SUMS" \
            deploy/portfolio/backup-production
          grep -Fq "database.dump SOURCE_SHA IMAGE_REF SHA256SUMS" \
            deploy/portfolio/restore-production
          grep -Fq "production-recovery.env" \
            deploy/portfolio/deploy-portfolio
          grep -Fq 'recovery_consumed_file="${recovery_consumed_dir}/${recovery_backup_sha}"' \
            deploy/portfolio/deploy-portfolio
          grep -Fq 'consumed_marker="${CONSUMED_DIR}/${backup_sha256}"' \
            deploy/portfolio/restore-production
          grep -Fq '/srv/apps/portfolio/prod/recovery-consumed' \
            host/install-portfolio-linux-files.sh
          grep -Fq "/usr/local/sbin/validate-deployment-manifest" \
            deploy/portfolio/deploy-portfolio
          grep -Fq '"${GITHUB_RUN_ATTEMPT}"' \
            deploy/portfolio/deploy-portfolio
          test "$(grep -Fc 'schema_version: 2' \
            .github/workflows/publish-and-deploy.yml)" -eq 2
          test "$(grep -Fc -- '--argjson workflow_run_attempt "$GITHUB_RUN_ATTEMPT"' \
            .github/workflows/publish-and-deploy.yml)" -eq 2
          ! grep -Fq 'schema_version: 1' \
            .github/workflows/publish-and-deploy.yml
          grep -Fq "/usr/local/sbin/restore-portfolio-production" \
            HOSTING_SETUP.md
          preflight_line="$(grep -nF "Snapshotting the authenticated historical database" \
            deploy/portfolio/deploy-portfolio | cut -d: -f1)"
          migration_line="$(grep -nF "Applying database migrations with the published immutable image" \
            deploy/portfolio/deploy-portfolio | cut -d: -f1)"
          test "${preflight_line}" -lt "${migration_line}"
          ! grep -Eq 'RETENTION_DAYS|mtime[[:space:]]+\\+' \
            deploy/portfolio/backup-production
          ! grep -RiqE \
            'staging-database-volume|legacy transition|restoring application image|production-import-complete' \
            deploy host HOSTING_SETUP.md

      - name: Build frontend and backend
        run: |
          npm run build --prefix Portfolio/ClientApp -- --configuration production
          dotnet build Portfolio.sln --configuration Release --no-restore

      - name: Rehearse database migration
        run: bash tests/schema-migration-test.sh

      - name: Run tests
        run: |
          npm test --prefix Portfolio/ClientApp -- --watch=false
          dotnet test Portfolio.sln --configuration Release --no-build \
            --logger "trx;LogFileName=tests.trx" \
            --results-directory artifacts/test-results

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portfolio-failure-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: artifacts/test-results/

  container:
    name: Validate runtime image and Compose model
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: portfolio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate non-root runtime content
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint /bin/sh portfolio:ci -ceu \
            'test "$(id -u)" -ne 0; test -r /app/appsettings.json; test -r /app/Portfolio.dll; test -r /app/dbup/PortfolioDatabase.dll'

      - name: Validate Compose
        env:
          DEPLOY_ENV: staging
          APP_ENVIRONMENT: Staging
          DB_VOLUME_NAME: portfolio-ci-postgres-data
          IMAGE_REF: portfolio:ci
          WEB_ALIAS: portfolio-ci-web
        run: |
          docker compose \
            --env-file deploy/secrets/portfolio-staging.env.example \
            --file deploy/portfolio/compose.yml \
            config --quiet
