name: Deploy merged revision

on:
  push:
    branches: [master, staging]
  workflow_dispatch:

permissions: {}

concurrency:
  group: portfolio-deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    name: Require a merged PR
    if: github.ref_name == 'master' || github.ref_name == 'staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify merged-PR provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          matching_prs="$(
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls?per_page=100" |
              jq \
                --arg branch "$GITHUB_REF_NAME" \
                --arg sha "$GITHUB_SHA" \
                '[.[] | select(.merged_at != null and .base.ref == $branch and .merge_commit_sha == $sha)] | length'
          )"
          if [[ "$matching_prs" == 0 ]]; then
            printf 'Deployment requires a merged PR targeting %s for commit %s.\n' \
              "$GITHUB_REF_NAME" "$GITHUB_SHA" >&2
            exit 1
          fi

  verify:
    name: Verify merged revision
    needs: source
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish immutable image
    needs: [source, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lyelt/portfolio:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export immutable reference
        id: image
        env:
          IMAGE_NAME: ghcr.io/lyelt/portfolio
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "image_ref=$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Write deployment manifest
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          ENVIRONMENT: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
        run: |
          mkdir -p deployment-request
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg application portfolio \
            --arg branch "$GITHUB_REF_NAME" \
            --arg environment "$ENVIRONMENT" \
            --arg image_ref "$IMAGE_REF" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schema_version: 1, repository: $repository, application: $application, branch: $branch, environment: $environment, image_ref: $image_ref, commit_sha: $commit_sha, workflow_run_url: $workflow_run_url, compose_files: ["deploy/portfolio/compose.yml"], health_paths: ["/livez", "/healthz"]}' \
            > "deployment-request/$ENVIRONMENT.json"

      - name: Publish deployment manifest artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deploy-${{ github.ref_name }}-${{ github.sha }}
          path: deployment-request/*.json
          if-no-files-found: error
          retention-days: 30

  deploy-staging:
    name: Deploy staging
    needs: publish
    if: github.ref_name == 'staging'
    environment:
      name: staging
      url: https://staging.ghobrial.dev
    runs-on: [self-hosted, linux, portfolio-deploy]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Authenticate immutable image pull
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          docker_config="$(mktemp -d)"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
          printf '%s' "$GHCR_TOKEN" |
            DOCKER_CONFIG="$docker_config" docker login ghcr.io \
              --username "$GITHUB_ACTOR" --password-stdin

      - name: Accept manifest and deploy
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" --arg application portfolio \
            --arg branch "$GITHUB_REF_NAME" --arg environment staging \
            --arg image_ref "$IMAGE_REF" --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schema_version: 1, repository: $repository, application: $application, branch: $branch, environment: $environment, image_ref: $image_ref, commit_sha: $commit_sha, workflow_run_url: $workflow_run_url, compose_files: ["deploy/portfolio/compose.yml"], health_paths: ["/livez", "/healthz"]}' > "$manifest"
          /usr/local/sbin/receive-deployment-manifest "$manifest"
          /usr/local/sbin/deploy-portfolio staging "$GITHUB_SHA" "$IMAGE_REF"

      - name: Remove registry credentials
        if: always()
        run: |
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi

  deploy-production:
    name: Deploy production
    needs: publish
    if: github.ref_name == 'master' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: https://ghobrial.dev
    runs-on: [self-hosted, linux, portfolio-deploy]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - name: Authenticate immutable image pull
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          docker_config="$(mktemp -d)"
          printf 'DOCKER_CONFIG=%s\n' "$docker_config" >> "$GITHUB_ENV"
          printf '%s' "$GHCR_TOKEN" |
            DOCKER_CONFIG="$docker_config" docker login ghcr.io \
              --username "$GITHUB_ACTOR" --password-stdin

      - name: Accept manifest and deploy
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" --arg application portfolio \
            --arg branch "$GITHUB_REF_NAME" --arg environment production \
            --arg image_ref "$IMAGE_REF" --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schema_version: 1, repository: $repository, application: $application, branch: $branch, environment: $environment, image_ref: $image_ref, commit_sha: $commit_sha, workflow_run_url: $workflow_run_url, compose_files: ["deploy/portfolio/compose.yml"], health_paths: ["/livez", "/healthz"]}' > "$manifest"
          /usr/local/sbin/receive-deployment-manifest "$manifest"
          /usr/local/sbin/deploy-portfolio prod "$GITHUB_SHA" "$IMAGE_REF"

      - name: Remove registry credentials
        if: always()
        run: |
          if [[ -n "${DOCKER_CONFIG:-}" ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi
