name: Publish and deploy Portfolio

on:
  push:
    branches:
      - staging
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: portfolio-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify source
    if: ${{ github.ref_name == 'staging' || github.ref_name == 'master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Portfolio.sln
      - name: Build
        run: dotnet build Portfolio.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test Portfolio.sln --configuration Release --no-build

  publish:
    name: Publish immutable image
    needs: verify
    if: ${{ github.ref_name == 'staging' || github.ref_name == 'master' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    outputs:
      image_ref: ${{ steps.build.outputs.image_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lyelt/portfolio:${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Set image output
        id: build
        env:
          IMAGE_NAME: ghcr.io/lyelt/portfolio
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: echo "image_ref=$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Write deployment manifest
        env:
          IMAGE_REF: ${{ steps.build.outputs.image_ref }}
          ENVIRONMENT: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
        run: |
          mkdir -p deployment-request
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg application "portfolio" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg environment "$ENVIRONMENT" \
            --arg image_ref "$IMAGE_REF" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schema_version: 1, repository: $repository, application: $application, branch: $branch, environment: $environment, image_ref: $image_ref, commit_sha: $commit_sha, workflow_run_url: $workflow_run_url, compose_files: ["deploy/portfolio/compose.yml"], health_paths: ["/livez", "/healthz"], database_rollback_policy: "previous-image-compatible-migrations-only"}' \
            > deployment-request/$ENVIRONMENT.json
      - name: Publish deployment manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-${{ github.ref_name }}-${{ github.sha }}
          path: deployment-request/*.json
          if-no-files-found: error
          retention-days: 30

  deploy-staging:
    name: Deploy exact staging digest
    needs: publish
    if: ${{ github.ref_name == 'staging' }}
    runs-on:
      - self-hosted
      - linux
      - ARM64
      - portfolio-deploy
    timeout-minutes: 60
    steps:
      - name: Accept manifest and deploy
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" --arg application portfolio \
            --arg branch "$GITHUB_REF_NAME" --arg environment staging \
            --arg image_ref "$IMAGE_REF" --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schema_version: 1, repository: $repository, application: $application, branch: $branch, environment: $environment, image_ref: $image_ref, commit_sha: $commit_sha, workflow_run_url: $workflow_run_url, compose_files: ["deploy/portfolio/compose.yml"], health_paths: ["/livez", "/healthz"]}' > "$manifest"
          /usr/local/sbin/receive-deployment-manifest "$manifest"
          /usr/local/sbin/deploy-portfolio staging "$GITHUB_SHA" "$IMAGE_REF"

  deploy-production:
    name: Deploy exact production digest
    needs: publish
    if: ${{ github.ref_name == 'master' && vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on:
      - self-hosted
      - linux
      - ARM64
      - portfolio-deploy
    timeout-minutes: 60
    steps:
      - name: Accept manifest and deploy
        env:
          IMAGE_REF: ${{ needs.publish.outputs.image_ref }}
        run: |
          set -Eeuo pipefail
          manifest="$(mktemp)"
          trap 'rm -f "$manifest"' EXIT
          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" --arg application portfolio \
            --arg branch "$GITHUB_REF_NAME" --arg environment production \
            --arg image_ref "$IMAGE_REF" --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{schema_version: 1, repository: $repository, application: $application, branch: $branch, environment: $environment, image_ref: $image_ref, commit_sha: $commit_sha, workflow_run_url: $workflow_run_url, compose_files: ["deploy/portfolio/compose.yml"], health_paths: ["/livez", "/healthz"]}' > "$manifest"
          /usr/local/sbin/receive-deployment-manifest "$manifest"
          /usr/local/sbin/deploy-portfolio prod "$GITHUB_SHA" "$IMAGE_REF"
