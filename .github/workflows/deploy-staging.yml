name: Deploy portfolio staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: portfolio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy exact staging commit
    if: ${{ github.repository == 'Lyelt/Portfolio' && github.ref == 'refs/heads/staging' }}
    runs-on:
      - self-hosted
      - linux
      - ARM64
      - portfolio-deploy
    timeout-minutes: 60
    steps:
      - name: Invoke fixed host deployment entrypoint
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          exec /usr/local/sbin/deploy-portfolio staging "${DEPLOY_SHA}"
